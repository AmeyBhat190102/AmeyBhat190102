# AURA Studio — full stack, one command:  docker compose up
# Mock providers by default (no API keys needed); set keys in .env to go live.

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: aura
      POSTGRES_PASSWORD: aura
      POSTGRES_DB: aura
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aura"]
      interval: 3s
      retries: 10

  redis:
    image: redis:7
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      retries: 10

  api:
    build: ./aura-studio
    environment: &engine_env
      DATABASE_URL: postgresql+asyncpg://aura:aura@postgres:5432/aura
      REDIS_URL: redis://redis:6379
      AURA_PROVIDERS: ${AURA_PROVIDERS:-mock}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      IDEOGRAM_API_KEY: ${IDEOGRAM_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      REPLICATE_API_TOKEN: ${REPLICATE_API_TOKEN:-}
      API_JWT_SECRET: ${API_JWT_SECRET:-dev-secret-change-me-32bytes-min!!}
      AURA_ARTIFACTS: /artifacts
    volumes: [artifacts:/artifacts]
    ports: ["8800:8800"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  worker:
    build: ./aura-studio
    command: arq aura.worker.WorkerSettings
    environment: *engine_env
    volumes: [artifacts:/artifacts]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  web:
    build: ./web
    environment:
      ENGINE_URL: http://api:8800
      API_JWT_SECRET: ${API_JWT_SECRET:-dev-secret-change-me-32bytes-min!!}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
    ports: ["3000:3000"]
    depends_on: [api]

volumes:
  pgdata:
  artifacts:
