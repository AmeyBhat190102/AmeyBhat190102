<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Template Studio — Agent Template Chat</title>
<style>
  :root {
    --bg: #f4f6fb;
    --surface: #ffffff;
    --border: #e3e8f0;
    --text: #1c2333;
    --muted: #66708a;
    --accent: #4f46e5;
    --accent-soft: #eef0ff;
    --user-bubble: #4f46e5;
    --ok: #16a34a;
    --err: #dc2626;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    flex-direction: column;
  }

  header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 14px 22px;
    display: flex;
    align-items: center;
    gap: 14px;
    flex-shrink: 0;
  }
  .logo {
    width: 36px; height: 36px; border-radius: 10px;
    background: var(--accent); color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px;
  }
  .title h1 { font-size: 16px; font-weight: 650; }
  .title p { font-size: 12px; color: var(--muted); margin-top: 2px; }
  header .spacer { flex: 1; }
  #status { font-size: 12px; color: var(--muted); }
  #status .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 5px; background: #cbd5e1; }
  #status.ok .dot { background: var(--ok); }
  #status.bad .dot { background: var(--err); }
  #newChat {
    border: 1px solid var(--border); background: var(--surface); color: var(--text);
    padding: 8px 14px; border-radius: 8px; font-size: 13px; cursor: pointer;
  }
  #newChat:hover { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }

  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 26px 0 12px;
  }
  .inner { max-width: 820px; margin: 0 auto; padding: 0 20px; display: flex; flex-direction: column; gap: 16px; }

  .msg { display: flex; flex-direction: column; max-width: 85%; }
  .msg.user { align-self: flex-end; align-items: flex-end; }
  .msg.assistant { align-self: flex-start; align-items: flex-start; }
  .bubble {
    padding: 11px 15px;
    border-radius: 14px;
    font-size: 14px;
    line-height: 1.55;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
  }
  .user .bubble { background: var(--user-bubble); color: #fff; border-bottom-right-radius: 4px; }
  .assistant .bubble { background: var(--surface); border: 1px solid var(--border); border-bottom-left-radius: 4px; }
  .assistant .bubble.error { border-color: var(--err); color: var(--err); background: #fef2f2; }

  .bubble code { background: rgba(100, 110, 140, 0.14); padding: 1px 5px; border-radius: 4px; font-size: 13px; font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
  .user .bubble code { background: rgba(255, 255, 255, 0.22); }
  .bubble pre {
    background: #171d2d; color: #e6e9f2;
    padding: 12px 14px; border-radius: 10px;
    overflow-x: auto; margin: 8px 0;
    white-space: pre;
  }
  .bubble pre code { background: none; padding: 0; color: inherit; }

  .tools { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 6px; }
  .chip {
    font-size: 11.5px; font-family: ui-monospace, Menlo, Consolas, monospace;
    background: var(--accent-soft); color: var(--accent);
    border: 1px solid #d9dcff;
    padding: 3px 9px; border-radius: 999px;
  }
  .chip.err { background: #fef2f2; color: var(--err); border-color: #fecaca; }

  .typing { display: inline-flex; gap: 5px; padding: 14px 16px; }
  .typing span {
    width: 7px; height: 7px; border-radius: 50%; background: var(--muted);
    animation: blink 1.2s infinite ease-in-out;
  }
  .typing span:nth-child(2) { animation-delay: 0.2s; }
  .typing span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes blink { 0%, 70%, 100% { opacity: 0.25; } 35% { opacity: 1; } }

  footer {
    flex-shrink: 0;
    background: linear-gradient(to top, var(--bg) 70%, transparent);
    padding: 10px 20px 20px;
  }
  .inputRow {
    max-width: 820px; margin: 0 auto;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    display: flex; align-items: flex-end; gap: 10px;
    padding: 10px 12px;
    box-shadow: 0 4px 18px rgba(28, 35, 51, 0.06);
  }
  .inputRow:focus-within { border-color: var(--accent); }
  textarea {
    flex: 1; border: none; outline: none; resize: none;
    font: inherit; font-size: 14px; line-height: 1.5;
    max-height: 160px; background: transparent; color: var(--text);
  }
  #send {
    border: none; background: var(--accent); color: #fff;
    width: 38px; height: 38px; border-radius: 10px;
    font-size: 16px; cursor: pointer; flex-shrink: 0;
  }
  #send:disabled { opacity: 0.45; cursor: default; }
  .hint { max-width: 820px; margin: 8px auto 0; font-size: 11.5px; color: var(--muted); text-align: center; }
</style>
</head>
<body>
  <header>
    <div class="logo">🎛️</div>
    <div class="title">
      <h1>Template Studio</h1>
      <p>Create &amp; update voice-agent templates by chatting</p>
    </div>
    <div class="spacer"></div>
    <div id="status"><span class="dot"></span><span id="statusText">connecting…</span></div>
    <button id="newChat">＋ New chat</button>
  </header>

  <main id="chat"><div class="inner" id="messages"></div></main>

  <footer>
    <div class="inputRow">
      <textarea id="input" rows="1" placeholder="Describe the agent template you want to create or update…"></textarea>
      <button id="send" title="Send">➤</button>
    </div>
    <div class="hint">Enter to send · Shift+Enter for a new line · templates are saved only after you confirm</div>
  </footer>

<script>
  const messagesEl = document.getElementById("messages");
  const chatEl = document.getElementById("chat");
  const inputEl = document.getElementById("input");
  const sendEl = document.getElementById("send");

  let sessionId = sessionStorage.getItem("sessionId") || crypto.randomUUID();
  sessionStorage.setItem("sessionId", sessionId);
  let busy = false;

  const WELCOME =
    "Hi! I help you **create and update voice-agent templates** on the vendor-calling server.\n\n" +
    "Tell me things like:\n" +
    "- \"Create a lead-qualification template for client acme-realty, in Hindi\"\n" +
    "- \"Fetch the active template for client acme-realty and make the tone more formal\"\n" +
    "- \"Test the draft — pretend I'm the callee\"\n\n" +
    "I'll draft the flow (Objective / Instruction / Guardrails), refine it with you, and only save when you say so.";

  // --- minimal markdown: code fences, inline code, bold, italics ---
  function esc(s) {
    return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }
  function renderMarkdown(text) {
    const parts = text.split(/```/);
    let html = "";
    for (let i = 0; i < parts.length; i++) {
      if (i % 2 === 1) {
        // code fence: drop an optional language tag on the first line
        const body = parts[i].replace(/^[a-zA-Z0-9_-]*\n/, "");
        html += "<pre><code>" + esc(body.replace(/\n$/, "")) + "</code></pre>";
      } else {
        html += esc(parts[i])
          .replace(/`([^`\n]+)`/g, "<code>$1</code>")
          .replace(/\*\*([^*\n]+)\*\*/g, "<strong>$1</strong>")
          .replace(/(^|\n)### ([^\n]+)/g, "$1<strong>$2</strong>")
          .replace(/(^|\n)## ([^\n]+)/g, "$1<strong>$2</strong>");
      }
    }
    return html;
  }

  function addMessage(role, text, { tools = [], error = false } = {}) {
    const msg = document.createElement("div");
    msg.className = "msg " + role;
    if (tools.length) {
      const toolsEl = document.createElement("div");
      toolsEl.className = "tools";
      for (const t of tools) {
        const chip = document.createElement("span");
        chip.className = "chip" + (t.ok === false ? " err" : "");
        chip.textContent = "🔧 " + t.name + (t.ok === false ? " ✗" : t.ok ? " ✓" : "");
        toolsEl.appendChild(chip);
      }
      msg.appendChild(toolsEl);
    }
    const bubble = document.createElement("div");
    bubble.className = "bubble" + (error ? " error" : "");
    if (role === "assistant") bubble.innerHTML = renderMarkdown(text);
    else bubble.textContent = text;
    msg.appendChild(bubble);
    messagesEl.appendChild(msg);
    chatEl.scrollTop = chatEl.scrollHeight;
    return msg;
  }

  function addTyping() {
    const msg = document.createElement("div");
    msg.className = "msg assistant";
    msg.innerHTML =
      '<div class="bubble typing"><span></span><span></span><span></span></div>';
    messagesEl.appendChild(msg);
    chatEl.scrollTop = chatEl.scrollHeight;
    return msg;
  }

  async function send() {
    const text = inputEl.value.trim();
    if (!text || busy) return;
    busy = true;
    sendEl.disabled = true;
    inputEl.value = "";
    inputEl.style.height = "auto";
    addMessage("user", text);
    const typing = addTyping();
    try {
      const res = await fetch("/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ sessionId, message: text }),
      });
      const data = await res.json();
      typing.remove();
      if (!res.ok) {
        addMessage("assistant", data.error || "Something went wrong.", { error: true });
      } else {
        addMessage("assistant", data.reply, { tools: data.tools || [] });
      }
    } catch (err) {
      typing.remove();
      addMessage("assistant", "Could not reach the server: " + err.message, { error: true });
    } finally {
      busy = false;
      sendEl.disabled = false;
      inputEl.focus();
    }
  }

  sendEl.addEventListener("click", send);
  inputEl.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      send();
    }
  });
  inputEl.addEventListener("input", () => {
    inputEl.style.height = "auto";
    inputEl.style.height = Math.min(inputEl.scrollHeight, 160) + "px";
  });

  document.getElementById("newChat").addEventListener("click", async () => {
    if (busy) return;
    try {
      await fetch("/api/reset", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ sessionId }),
      });
    } catch {}
    sessionId = crypto.randomUUID();
    sessionStorage.setItem("sessionId", sessionId);
    messagesEl.innerHTML = "";
    addMessage("assistant", WELCOME);
    inputEl.focus();
  });

  // health check → header status
  (async () => {
    const statusEl = document.getElementById("status");
    const statusText = document.getElementById("statusText");
    try {
      const res = await fetch("/api/health");
      const h = await res.json();
      if (!h.keyConfigured) {
        statusEl.className = "bad";
        statusText.textContent = "ANTHROPIC_API_KEY missing";
      } else {
        statusEl.className = "ok";
        statusText.textContent = h.model + " · " + new URL(h.mcpServer).hostname;
      }
    } catch {
      statusEl.className = "bad";
      statusText.textContent = "server unreachable";
    }
  })();

  addMessage("assistant", WELCOME);
  inputEl.focus();
</script>
</body>
</html>
