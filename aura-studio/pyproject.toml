[project]
name = "aura-studio"
version = "0.1.0"
description = "AURA — a multi-agent design intelligence studio: multimodal briefs in, gallery-grade designs out."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "langgraph>=0.2",
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
    "anthropic>=0.34",
    "httpx>=0.27",
    "playwright>=1.45",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
aura = "aura.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aura"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
