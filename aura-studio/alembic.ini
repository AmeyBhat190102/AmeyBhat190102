[alembic]
script_location = migrations
prepend_sys_path = src
# DATABASE_URL env var wins; this is the dev default
sqlalchemy.url = sqlite:///./aura.db

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
