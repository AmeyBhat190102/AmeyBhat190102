[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["F", "E", "W", "I", "UP", "B", "SIM", "ARG", "RET", "C4"]

[tool.ruff.lint.per-file-ignores]
# Pytest fixtures are often requested for their side effects (patched env, a
# reset database) rather than their value, and fixture text is allowed to be
# wide so sample documents stay readable.
"tests/*" = ["ARG001", "E501"]
